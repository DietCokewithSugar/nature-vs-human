# Render Blueprint: a static site served from Render's CDN.
# Connect the repo in Render → New → Blueprint, then fill in the two Supabase values.
services:
  - type: web
    name: human-bill
    runtime: static
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    headers:
      # Hashed build output never changes: cache for a year.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /models/*
        name: Cache-Control
        value: public, max-age=604800
      # The sprite atlas keeps its name across bakes: cache for a day only.
      - path: /sprites/*
        name: Cache-Control
        value: public, max-age=86400
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
